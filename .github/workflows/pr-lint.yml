name: PR lint

# Org convention for every change that lands on main (TogetherWeOwn GitHub standard):
#   * PR title = Conventional Commits header: `type(scope): summary`, <= 100 chars, no trailing period.
#     Types: feat fix perf refactor test docs build ci chore revert style security.
#     This repo is public: keep internal tracker IDs out of the title and body;
#     link only public GitHub issues.
#   * PR body explains what changed, why, and how it was tested.
#   * Repos are squash-merge only and the squash commit title is the PR title, so the history on
#     main is one conventional commit per PR. The push job below flags any commit that bypasses it
#     (for example a merge call that passes its own commit_title).

on:
  # Linting a pull request is opt-in (TOG-12060, TOG-12911, TOG-12971): opening,
  # pushing to, editing or reopening a PR does not run it. A maintainer adds any
  # label to the PR's exact head to produce `pr-lint` as a `pull_request` check
  # run, which is what the PR's required check reads. A new push or an edited
  # title/body needs the label removed and added again. There is deliberately no
  # job-level `if` and no path filter: a skipped required job reports success, so
  # every `labeled` event must run the real job.
  pull_request:
    types: [labeled]
  push:
    branches: [main]
  # Dispatched by the release workflow (TOG-9865) on release-please branches:
  # PRs opened with GITHUB_TOKEN trigger no workflows, so the required
  # `pr-lint` check would never run on the release PR without this path.
  # The release workflow passes the release PR number; this job fetches the
  # title/body via the API (needs pull-requests: read) and validates them with
  # the same ci/check-pr-conventions.py script as the pull_request path. Dispatch
  # runs are not in a PR's status rollup, so they do not satisfy the required
  # check; use the label.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Release PR number to validate"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-lint-${{ github.event.pull_request.number || inputs.pr_number || github.sha }}
  cancel-in-progress: true

jobs:
  # Same trusted gate as ci.yml: an outside contributor's pull request must not
  # execute on our self-hosted runners (TOG-3103). It checks out the BASE
  # commit, so the fork cannot supply the script that decides whether to trust
  # it; scripts/ci/check-fork-gate-coverage.mjs pins the exact step list.
  fork-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Refuse fork pull requests
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: ./scripts/ci/refuse-fork-pr.sh
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install trusted workflow parser
        run: npm ci --ignore-scripts --prefix scripts/ci
      - name: Read candidate workflows
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          sparse-checkout: .github/workflows
          persist-credentials: false
      - name: Verify the fork gate against candidate wiring
        run: ./scripts/ci/refuse-fork-pr.test.sh "$GITHUB_WORKSPACE/candidate"

  pr-lint:
    name: pr-lint
    needs: fork-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level, not workflow-wide: the fork-gate coverage check rejects
    # workflow env because it would also reach the trusted gate.
    env:
      REQUIRE_CARD_REF: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve PR title/body
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env (not inlined into the script) so titles/bodies
          # containing quotes can't break shell parsing.
          EVENT_TITLE: ${{ github.event.pull_request.title }}
          EVENT_BODY: ${{ github.event.pull_request.body }}
          EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Validating release PR #$PR_NUMBER via the API."
            TITLE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
            BODY=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            AUTHOR=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json author --jq .author.login)
            # The default checkout is the dispatch ref (the release branch
            # head = the PR head), which is the SHA required checks match on.
            EVENT=pull_request
          else
            TITLE="$EVENT_TITLE"
            BODY="$EVENT_BODY"
            AUTHOR="$EVENT_AUTHOR"
            EVENT='${{ github.event_name }}'
          fi
          {
            echo "title<<PR_EOF"
            echo "$TITLE"
            echo "PR_EOF"
            echo "body<<PR_EOF"
            echo "$BODY"
            echo "PR_EOF"
            echo "author=$AUTHOR"
            echo "event=$EVENT"
          } >> "$GITHUB_OUTPUT"

      - name: Check title, body and commits
        env:
          EVENT: ${{ steps.pr.outputs.event }}
          TITLE: ${{ steps.pr.outputs.title }}
          BODY: ${{ steps.pr.outputs.body }}
          AUTHOR: ${{ steps.pr.outputs.author }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: python3 ci/check-pr-conventions.py
