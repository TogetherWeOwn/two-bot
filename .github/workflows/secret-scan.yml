name: secret-scan

# Why this exists as well as GitHub's own secret scanning:
# GitHub's push protection is free on public repos. These repos are private
# until the launch hardening pass clears them, and on a private repo that
# feature is a paid add-on. This job is the free equivalent and it is a
# required check, so a secret cannot reach main by accident.
#
# It is not a substitute for care. A secret that reaches a branch is already
# leaked - rotate it, do not just delete the line.
#
# We run the gitleaks BINARY, not gitleaks/gitleaks-action@v2. The action
# refuses to run for an organization without a paid licence key:
#
#   [TWO-Gaming] is an organization. License key is required.
#   missing gitleaks license. Go grab one at gitleaks.io
#
# That is the refusal verbatim, from the first push back when these repos lived in
# the TWO-Gaming org. The org name is the only part the transfer changed:
# TogetherWeOwn is an organization too, so the action would refuse here just the
# same. Left as recorded rather than rewritten, because it is a transcript.
#
# Discovering that on the first push would have left
# the only secret scanning we have permanently red. The scanner itself is MIT
# licensed and free for anyone; only the convenience wrapper is sold. Pinned to
# a release by version so a new upstream rule set cannot turn the build red on
# a morning nobody changed anything.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: [self-hosted, two-selfhosted]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a secret added and then removed in an earlier commit
          # on the same branch is still a leak, and a shallow clone hides it.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the full history
        run: |
          set -euo pipefail
          # `git` mode walks every commit reachable from HEAD, which is why the
          # checkout above is unshallow. A secret that was added and then
          # deleted in a later commit is still a secret that was published.
          # --redact so the finding names the file and the rule but never
          # prints the value into a log anyone with read access can see.
          gitleaks git . --redact --verbose --exit-code 1
