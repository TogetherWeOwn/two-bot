name: secret-scan

# Why this exists as well as GitHub's own secret scanning:
# GitHub's push protection is free on public repos. These repos are private
# until the launch hardening pass clears them, and on a private repo that
# feature is a paid add-on. This job is the free equivalent and it is a
# required check, so a secret cannot reach main by accident.
#
# It is not a substitute for care. A secret that reaches a branch is already
# leaked - rotate it, do not just delete the line.
#
# We run the gitleaks BINARY, not gitleaks/gitleaks-action@v2. The action
# refuses to run for an organization without a paid licence key:
#
#   [TWO-Gaming] is an organization. License key is required.
#   missing gitleaks license. Go grab one at gitleaks.io
#
# That is the refusal verbatim, from the first push back when these repos lived in
# the TWO-Gaming org. The org name is the only part the transfer changed:
# TogetherWeOwn is an organization too, so the action would refuse here just the
# same. Left as recorded rather than rewritten, because it is a transcript.
#
# Discovering that on the first push would have left
# the only secret scanning we have permanently red. The scanner itself is MIT
# licensed and free for anyone; only the convenience wrapper is sold. Pinned to
# a release by version so a new upstream rule set cannot turn the build red on
# a morning nobody changed anything.

on:
  pull_request:
  push:
    branches: [main]
  # Dispatched by the release workflow (TOG-9865) on release-please branches:
  # PRs opened with GITHUB_TOKEN trigger no workflows, so the required
  # `gitleaks` check would never run on the release PR without this path.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # See ci.yml for the full argument. Short version: these runners are
  # self-hosted and persistent, so a fork's pull request must not reach them,
  # and the gate checks out the base commit rather than the pull request so the
  # fork is not the one supplying the guard (TOG-3103).
  fork-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      # The policy must already be on the base; no candidate-selected fallback.
      - name: Refuse fork pull requests
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: ./scripts/ci/refuse-fork-pr.sh
      # Match ci.yml: only trusted policy code runs; candidate checkout is data.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install trusted workflow parser
        run: npm ci --ignore-scripts --prefix scripts/ci
      - name: Read candidate workflows
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          sparse-checkout: .github/workflows
          persist-credentials: false
      - name: Verify the fork gate against candidate wiring
        run: ./scripts/ci/refuse-fork-pr.test.sh "$GITHUB_WORKSPACE/candidate"

  gitleaks:
    needs: fork-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret added and then removed in an earlier commit
          # on the same branch is still a leak, and a shallow clone hides it.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          # TOG-5538: persistent self-hosted runners share /tmp across
          # concurrent jobs, so a fixed /tmp/gitleaks.tar.gz path collides
          # (curl (23) writing output). Use a per-job isolated dir plus
          # retry so a transient download failure retries instead of
          # failing the check in ~4s with no scan executed.
          WORKDIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/gitleaks-install.XXXXXX")"
          trap 'rm -rf "$WORKDIR"' EXIT
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors \
            -o "$WORKDIR/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$WORKDIR/gitleaks.tar.gz" -C "$WORKDIR" gitleaks
          sudo install -m 0755 "$WORKDIR/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the full history
        run: |
          set -euo pipefail
          # `git` mode walks every commit reachable from HEAD, which is why the
          # checkout above is unshallow. A secret that was added and then
          # deleted in a later commit is still a secret that was published.
          # --redact so the finding names the file and the rule but never
          # prints the value into a log anyone with read access can see.
          gitleaks git . --redact --verbose --exit-code 1
