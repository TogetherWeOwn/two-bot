name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by the release workflow (TOG-9865) on release-please branches:
  # PRs opened with GITHUB_TOKEN trigger no workflows, so the required `check`
  # would never run on the release PR without this path.
  workflow_dispatch:

# A second push to the same PR cancels the first in-flight run. Mirrors
# two-web/two-design's ci.yml — never cancel main, since nothing downstream
# keys off an in-progress main run here, but there is no reason to burn two
# full `check`+`postgres` runs on a PR that got pushed to twice in a minute.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # An outside contributor's pull request must not execute on our hardware.
  # Every runner here is self-hosted and persistent — five share one host — so
  # a fork's code would run next to whatever the last job left behind
  # (TOG-3103). This is the only job a fork ever reaches, and everything else
  # in this workflow waits on it.
  #
  # It checks out the BASE commit, not the pull request. Running the pull
  # request's copy would mean asking the fork to supply the script that decides
  # whether to trust the fork.
  #
  # Delete this job, and the `needs:` lines below, in the commit that moves
  # this workflow to hosted runners. On a hosted runner there is no host of
  # ours to protect and this would only turn away contributions.
  fork-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      # Policy lands independently on main before this workflow. A missing
      # base policy fails closed; the candidate cannot select a bootstrap ref.
      - name: Refuse fork pull requests
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: ./scripts/ci/refuse-fork-pr.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # This lockfile belongs to the trusted policy, not the candidate. The YAML
      # parser is CI-only; no candidate packages or lifecycle scripts execute.
      - name: Install trusted workflow parser
        run: npm ci --ignore-scripts --prefix scripts/ci
      # Read the proposed workflow files, not the old base wiring. Checkout
      # only materializes data here: all commands below still use the policy
      # at the workspace root. No candidate actions/scripts are invoked.
      # https://github.com/actions/checkout/tree/v5#fetch-only-the-root-files-and-github-and-src-folder
      - name: Read candidate workflows
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          sparse-checkout: .github/workflows
          persist-credentials: false
      - name: Verify the fork gate against candidate wiring
        run: ./scripts/ci/refuse-fork-pr.test.sh "$GITHUB_WORKSPACE/candidate"

  check:
    needs: fork-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: two
          POSTGRES_PASSWORD: two
          POSTGRES_DB: two_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U two -d two_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      # Needs neither node nor the database, so it runs before both and a PR
      # that hardcodes a guild id fails in seconds instead of after `npm ci`.
      # The count in src/ may only go down; scripts/ci/check-src-snowflakes.sh
      # explains why that is the rule (TOG-3103).
      - run: ./scripts/ci/check-src-snowflakes.sh

      # The ratchet is only worth its line in the workflow if it still refuses
      # things, so its own mutation cases run alongside it.
      - run: ./scripts/ci/check-src-snowflakes.test.sh

      # No live console.* calls in src/ outside tests: they bypass the
      # structured redaction-safe logger (TOG-8693). Hermetic bash+perl like
      # the snowflake ratchet, so a violating PR fails in seconds. The
      # self-test runs alongside for the same reason: a ban guard is only
      # worth its line if it still refuses things.
      - run: ./scripts/ci/check-src-console.sh
      - run: ./scripts/ci/check-src-console.test.sh

      # Five runners share one host, so Docker assigns an unused host port
      # instead of every job fighting over 5432. Set the database URLs at
      # runtime so every later step reads the mapped port.
      - name: Configure Postgres connection
        env:
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          echo "PGPORT=$PGPORT" >> "$GITHUB_ENV"
          echo "TWO_TEST_DATABASE_URL=postgres://two:two@127.0.0.1:$PGPORT/two_test" >> "$GITHUB_ENV"
          echo "TWO_DATABASE_URL=postgres://two:two@127.0.0.1:$PGPORT/two_test" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # --include=dev matters: some environments set NODE_ENV=production,
      # which makes npm silently skip devDependencies and typecheck disappears.
      - run: npm ci --include=dev

      # Keep typecheck, the service-DB suite, owned-cluster restart tests and the
      # grant self-test on the required check path. The wrapper's execution
      # tests pin order and fail-fast propagation, not just YAML command text.
      # Owned storage provisions integrity-pinned binaries in private scratch;
      # the service container/ambient database settings never reach its child.
      - name: Run required checks including owned storage
        run: ./scripts/ci/run-check-job.sh

      # Fixed workload and unchanged budgets, three independent samples.
      # Every failure is retained; only the disposable service DB is reached.
      - name: Check event-store benchmark budgets
        run: bash scripts/ci/run-event-store-bench.sh

  # Exercise the website views and least-privilege grants end to end after the
  # required check has proved the full Postgres-backed suite.
  postgres:
    needs: [fork-gate, check]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: two
          POSTGRES_PASSWORD: two
          POSTGRES_DB: two_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U two -d two_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Only ever reaches this throwaway container. The real one goes to the
      # Web Lead through docs/SECRETS.md and never near a repo or a log.
      TWO_WEB_RO_PASSWORD: ci-throwaway-not-a-secret

    steps:
      - uses: actions/checkout@v5

      # Five runners share one host, so Docker assigns an unused host port
      # instead of every job fighting over 5432. Set the database URLs at
      # runtime so every later step reads the mapped port.
      - name: Configure Postgres connection
        env:
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          echo "PGPORT=$PGPORT" >> "$GITHUB_ENV"
          echo "TWO_TEST_DATABASE_URL=postgres://two:two@127.0.0.1:$PGPORT/two_test" >> "$GITHUB_ENV"
          echo "TWO_DATABASE_URL=postgres://two:two@127.0.0.1:$PGPORT/two_test" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # --include=dev matters: some environments set NODE_ENV=production,
      # which makes npm silently skip devDependencies and typecheck disappears.
      - run: npm ci --include=dev

      # `npm test`, plus an assertion that the Postgres-only suites actually ran.
      # Then execute the deploy sequence from docs/WEBSITE_CONTRACT.md §7 and
      # prove the website role can read the views and nothing else.
      #
      # The wrapper is intentionally a checked-in script rather than five opaque
      # workflow steps: its self-test pins their order and fail-fast behavior,
      # and a failure annotation can name the exact command sequence to reproduce.
      - name: Verify Postgres contract and website role
        run: |
          if ! ./scripts/ci/run-postgres-job.sh; then
            echo "::error title=Postgres contract failed::Run ./scripts/ci/run-postgres-job.sh with TWO_TEST_DATABASE_URL and TWO_DATABASE_URL set to reproduce."
            exit 1
          fi

      - name: Verify the Postgres workflow wrapper
        run: ./scripts/ci/run-postgres-job.test.sh
