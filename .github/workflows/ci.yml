name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # --include=dev matters: some environments set NODE_ENV=production,
      # which makes npm silently skip devDependencies and typecheck disappears.
      - run: npm ci --include=dev

      # Node strips types, it does not check them. Without this step type
      # errors reach production perfectly happily.
      - run: npm run typecheck

      - run: npm test

  # The same suite against a real Postgres, plus the website's grants.
  #
  # This job exists because the `check` job above cannot see any of it. Every
  # Postgres-only test skips itself when TWO_TEST_DATABASE_URL is unset - which
  # is every run of `check` - so the backup round trip, the concurrent-writer
  # test and the whole web_v1 contract were green by absence, not by passing.
  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: two
          POSTGRES_PASSWORD: two
          POSTGRES_DB: two_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U two"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TWO_TEST_DATABASE_URL: postgres://two:two@localhost:5432/two_test
      TWO_DATABASE_URL: postgres://two:two@localhost:5432/two_test
      # Only ever reaches this throwaway container. The real one goes to the
      # Web Lead through docs/SECRETS.md and never near a repo or a log.
      TWO_WEB_RO_PASSWORD: ci-throwaway-not-a-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --include=dev

      - run: npm test

      # The deploy sequence from docs/WEBSITE_CONTRACT.md §7, run end to end.
      # Documented steps that nothing executes are how a runbook rots.
      - run: npm run migrate
      - run: npm run web:views

      # "The website role can read the views and nothing else", attempted rather
      # than asserted. This is the step that stops a future migration quietly
      # handing the website more access than it needs.
      - run: npm run web:role
      - run: npm run verify:web-role
