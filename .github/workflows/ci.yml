name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same PR cancels the first in-flight run. Mirrors
# two-web/two-design's ci.yml — never cancel main, since nothing downstream
# keys off an in-progress main run here, but there is no reason to burn two
# full `check`+`postgres` runs on a PR that got pushed to twice in a minute.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # An outside contributor's pull request must not execute on our hardware.
  # Every runner here is self-hosted and persistent — five share one host — so
  # a fork's code would run next to whatever the last job left behind
  # (TOG-3103). This is the only job a fork ever reaches, and everything else
  # in this workflow waits on it.
  #
  # It checks out the BASE commit, not the pull request. Running the pull
  # request's copy would mean asking the fork to supply the script that decides
  # whether to trust the fork.
  #
  # Delete this job, and the `needs:` lines below, in the commit that moves
  # this workflow to hosted runners. On a hosted runner there is no host of
  # ours to protect and this would only turn away contributions.
  fork-gate:
    runs-on: [self-hosted, two-selfhosted]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Refuse fork pull requests
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: ./scripts/ci/refuse-fork-pr.sh

      # The gate is worth a job only while it still refuses things.
      - name: Verify the fork gate
        run: ./scripts/ci/refuse-fork-pr.test.sh

  check:
    needs: fork-gate
    runs-on: [self-hosted, two-selfhosted]
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: two
          POSTGRES_PASSWORD: two
          POSTGRES_DB: two_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U two"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      # Five runners share one host, so Docker assigns an unused host port
      # instead of every job fighting over 5432. Set the database URLs at
      # runtime so every later step reads the mapped port.
      - name: Configure Postgres connection
        env:
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          echo "PGPORT=$PGPORT" >> "$GITHUB_ENV"
          echo "TWO_TEST_DATABASE_URL=postgres://two:two@127.0.0.1:$PGPORT/two_test" >> "$GITHUB_ENV"
          echo "TWO_DATABASE_URL=postgres://two:two@127.0.0.1:$PGPORT/two_test" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # --include=dev matters: some environments set NODE_ENV=production,
      # which makes npm silently skip devDependencies and typecheck disappears.
      - run: npm ci --include=dev

      # Node strips types, it does not check them. Without this step type
      # errors reach production perfectly happily.
      - run: npm run typecheck

      # The required `check` context runs the complete Postgres-backed suite.
      - run: npm run test:postgres

      # The TOG-64 grant check ships its own six cases and needs neither a token
      # nor the network, so there is no reason for it to rot untested. It is the
      # only check that fails on a half-applied grant; if its bit arithmetic
      # breaks, the de-escalation silently stops being verifiable.
      - run: npm run verify:grant:selftest

  # Exercise the website views and least-privilege grants end to end after the
  # required check has proved the full Postgres-backed suite.
  postgres:
    needs: [fork-gate, check]
    runs-on: [self-hosted, two-selfhosted]
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: two
          POSTGRES_PASSWORD: two
          POSTGRES_DB: two_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U two"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Only ever reaches this throwaway container. The real one goes to the
      # Web Lead through docs/SECRETS.md and never near a repo or a log.
      TWO_WEB_RO_PASSWORD: ci-throwaway-not-a-secret

    steps:
      - uses: actions/checkout@v5

      # Five runners share one host, so Docker assigns an unused host port
      # instead of every job fighting over 5432. Set the database URLs at
      # runtime so every later step reads the mapped port.
      - name: Configure Postgres connection
        env:
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          echo "PGPORT=$PGPORT" >> "$GITHUB_ENV"
          echo "TWO_TEST_DATABASE_URL=postgres://two:two@127.0.0.1:$PGPORT/two_test" >> "$GITHUB_ENV"
          echo "TWO_DATABASE_URL=postgres://two:two@127.0.0.1:$PGPORT/two_test" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # --include=dev matters: some environments set NODE_ENV=production,
      # which makes npm silently skip devDependencies and typecheck disappears.
      - run: npm ci --include=dev

      # `npm test`, plus an assertion that the Postgres-only suites actually ran.
      # Then execute the deploy sequence from docs/WEBSITE_CONTRACT.md §7 and
      # prove the website role can read the views and nothing else.
      #
      # The wrapper is intentionally a checked-in script rather than five opaque
      # workflow steps: its self-test pins their order and fail-fast behavior,
      # and a failure annotation can name the exact command sequence to reproduce.
      - name: Verify Postgres contract and website role
        run: |
          if ! ./scripts/ci/run-postgres-job.sh; then
            echo "::error title=Postgres contract failed::Run ./scripts/ci/run-postgres-job.sh with TWO_TEST_DATABASE_URL and TWO_DATABASE_URL set to reproduce."
            exit 1
          fi

      - name: Verify the Postgres workflow wrapper
        run: ./scripts/ci/run-postgres-job.test.sh
