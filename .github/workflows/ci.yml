name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same PR cancels the first in-flight run. Mirrors
# two-web/two-design's ci.yml — never cancel main, since nothing downstream
# keys off an in-progress main run here, but there is no reason to burn two
# full `check`+`postgres` runs on a PR that got pushed to twice in a minute.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # --include=dev matters: some environments set NODE_ENV=production,
      # which makes npm silently skip devDependencies and typecheck disappears.
      - run: npm ci --include=dev

      # Node strips types, it does not check them. Without this step type
      # errors reach production perfectly happily.
      - run: npm run typecheck

      - run: npm test

      # The TOG-64 grant check ships its own six cases and needs neither a token
      # nor the network, so there is no reason for it to rot untested. It is the
      # only check that fails on a half-applied grant; if its bit arithmetic
      # breaks, the de-escalation silently stops being verifiable.
      - run: npm run verify:grant:selftest

  # The same suite against a real Postgres, plus the website's grants.
  #
  # This job exists because the `check` job above cannot see any of it. Every
  # Postgres-only test skips itself when TWO_TEST_DATABASE_URL is unset - which
  # is every run of `check` - so the backup round trip, the concurrent-writer
  # test and the whole web_v1 contract were green by absence, not by passing.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: two
          POSTGRES_PASSWORD: two
          POSTGRES_DB: two_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U two"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TWO_TEST_DATABASE_URL: postgres://two:two@localhost:5432/two_test
      TWO_DATABASE_URL: postgres://two:two@localhost:5432/two_test
      # Only ever reaches this throwaway container. The real one goes to the
      # Web Lead through docs/SECRETS.md and never near a repo or a log.
      TWO_WEB_RO_PASSWORD: ci-throwaway-not-a-secret

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --include=dev

      # `npm test`, plus an assertion that the Postgres-only suites actually ran.
      #
      # Without that assertion this job proves the database was reachable, not
      # that anything used it. The suites skip themselves when
      # TWO_TEST_DATABASE_URL is unset, and a skipped suite reports
      # `# tests 0 # skipped 0` and exit 0 - so renaming the env var above, or
      # growing a second skip condition, would leave this job green with the
      # suites silently back to skipping. That is the exact failure the job
      # exists to kill, reintroduced without anyone touching CI (TOG-475).
      #
      # It asserts from inside the job because it has to: the broker profile
      # withholds `actions:read` (TOG-247), so nothing can read this log from
      # outside to check afterwards.
      - run: npm run test:postgres

      # The deploy sequence from docs/WEBSITE_CONTRACT.md §7, run end to end.
      # Documented steps that nothing executes are how a runbook rots.
      - run: npm run migrate
      - run: npm run web:views

      # "The website role can read the views and nothing else", attempted rather
      # than asserted. This is the step that stops a future migration quietly
      # handing the website more access than it needs.
      - run: npm run web:role
      - run: npm run verify:web-role
