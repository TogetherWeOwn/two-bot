name: coverage-fixture
on:
  pull_request:
jobs:
  fork-gate:
    runs-on: [self-hosted, two-selfhosted]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Refuse fork pull requests
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: ./scripts/ci/refuse-fork-pr.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install trusted workflow parser
        run: npm ci --ignore-scripts --prefix scripts/ci
      - name: Read candidate workflows
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          sparse-checkout: .github/workflows
          persist-credentials: false
      - name: Verify candidate wiring
        run: ./scripts/ci/refuse-fork-pr.test.sh "$GITHUB_WORKSPACE/candidate"
  check:
    needs: fork-gate
    runs-on: [self-hosted, two-selfhosted]
    steps:
      - run: 'true'
