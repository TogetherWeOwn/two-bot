# gitleaks configuration for two-bot.
#
# The default rule set, plus a deliberately small allowlist. Every entry below
# is here because gitleaks flagged it on the first real scan of this history and
# it was checked by hand and is not a credential. Nothing here is a blanket
# "ignore this rule" or "ignore this directory".
#
# The bar for adding to this file: you looked at the actual line, you can say
# what it is, and disclosing it to a stranger costs nothing. If you cannot say
# that, it is a secret - rotate it, do not allowlist it. Deleting the line is
# not enough either; it is in the history and history is what this scans.

[extend]
useDefault = true

[allowlist]
description = "Hand-checked non-secrets, 2026-08-20"
regexTarget = "match"

regexes = [
  # 1. Placeholders in documentation that show WHERE a token goes.
  #    `DISCORD_BOT_TOKEN=<bot token> node scripts/audit-collect.ts`
  #    An angle-bracketed placeholder is by definition not the value.
  '''<[A-Za-z][A-Za-z ._-]{0,30}(token|key|secret|password)>''',

  # 2. Discord snowflake IDs assigned to an ID-named variable.
  #    A guild / channel / role / application ID is public: every member of the
  #    server can read it, and it is in the widget and the invite. It is not a
  #    credential and there is nothing to rotate. gitleaks' `discord-client-id`
  #    rule matches any 17-20 digit number near the word discord.
  #
  #    Kept narrow on purpose - it allows a BARE run of digits assigned to a
  #    variable whose name ends in _ID. A real bot token is base64 with dots in
  #    it (`MTIz....XXXXXX.YYY...`) and does not match this, so it still trips.
  '''(?i)[A-Z0-9_]*(GUILD|CHANNEL|ROLE|APPLICATION|CLIENT|USER|CATEGORY)_ID['"]?\s*[:=]\s*['"]?[0-9]{17,20}['"]?''',
]

# `.env` is gitignored and has never been tracked. It is listed here so that a
# local `gitleaks git .` run in a working copy that HAS one does not spend its
# output on a file that was never going to be committed. It is NOT excluded
# from the committed-file check - the pre-commit hook and the `no .env
# committed` assertion in setup-github.sh --verify both still cover that.
paths = [
  '''^\.env$''',
]
